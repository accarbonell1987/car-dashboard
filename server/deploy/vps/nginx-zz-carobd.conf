# /etc/nginx/sites-available/zz-carobd
# El nombre empieza con "zz-" a propósito: nginx toma como servidor por defecto el primer vhost
# en orden alfabético, y un nombre como "carobd" le quitaría ese lugar a guay-gestion.
# Solo puerto 80: certbot agrega el bloque 443 y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_CAROBD;

    # Un sync trae a lo sumo unos cientos de viajes en JSON.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:PUERTO_CAROBD;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El cliente corta a los 30 s; nginx espera un poco más para que el que corte sepa por qué.
        proxy_read_timeout 45s;
    }
}
