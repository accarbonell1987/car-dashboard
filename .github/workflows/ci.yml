name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-y-servidor:
    name: Core y servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de core y servidor
        run: ./gradlew -Pcarobd.android=false :core:test :server:test
      - name: Jar del servidor
        run: ./gradlew -Pcarobd.android=false :server:fatJar
      - uses: actions/upload-artifact@v4
        with:
          name: server-all
          path: server/build/libs/server-all.jar

  apps-android:
    name: Apps Android (pantalla y móvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuración
        run: ./gradlew :screen:assembleDebug :mobile:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            screen/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
