name: CI

# Solo manual (pestaña Actions > CI > Run workflow) para no gastar minutos.
# Lo normal es verificar en local con scripts/verificar-local.sh, que corre lo mismo en Docker.
on:
  workflow_dispatch:

jobs:
  core-y-servidor:
    name: Core y servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de core y servidor
        run: ./gradlew -Pcarobd.android=false :core:jvmTest :server:test
      - name: Jar del servidor
        run: ./gradlew -Pcarobd.android=false :server:fatJar
      - uses: actions/upload-artifact@v4
        with:
          name: server-all
          path: server/build/libs/server-all.jar

  apps-android:
    name: Apps Android (pantalla y móvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # El runner de Ubuntu ya trae el Android SDK (ANDROID_HOME); AGP baja la plataforma 35 si falta.
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuración
        run: ./gradlew :screen:assembleDebug :mobile:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            screen/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk

  capturas:
    name: Capturas de pantallas (Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Dibuja pantallas en JVM, sin emulador, y las sube como artifact para mirarlas.
      - name: Dibujar capturas
        run: ./gradlew :screen:testDebugUnitTest --tests '*AsistenteCapturasTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            screen/build/capturas/
            screen/build/reports/tests/
